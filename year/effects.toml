# ---- Weather ----

[[effect]]
when = "rain"
who = ["*"]
says = "It is raining outside."

# Only people who are out in it get wet hands and a wet screen; a desk in an office stays dry.
[[effect]]
when = "rain"
who = ["fabricator", "food-stall", "trial-advocate", "junior-advocate", "wedding-photographer", "videographer", "site-engineer"]
says = "Wet hands and drops on the screen."
slip = 0.04
read = -1

[[effect]]
when = "rain"
who = ["fabricator"]
says = "The site visit is under a building's porch, out of the rain."
patience = -1

[[effect]]
when = "heavy_rain"
who = ["*"]
says = "Heavy rain and a red alert: roads are flooded and trains have stopped."
patience = -1

[[effect]]
when = "heavy_rain"
who = ["fabricator", "food-stall", "trial-advocate", "junior-advocate", "wedding-photographer", "videographer", "site-engineer"]
slip = 0.04
patience = -1

[[effect]]
when = "heavy_rain"
who = ["trial-advocate", "junior-advocate"]
place = "On a crowded station platform, trains stopped"
says = "They may not reach court today."

[[effect]]
when = "heavy_rain"
who = ["firm-associate", "in-house-counsel"]
place = "At home; the office told everyone to stay in"

[[effect]]
when = "summer"
who = ["fabricator", "food-stall"]
says = "A hot, humid day: sweat on the screen."
slip = 0.02
patience = -1

