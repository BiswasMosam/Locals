# What a kind of day does to each job. Read by town/year.py; the reasons are in study/year.md.
#
# when      sunday | holiday | festival:<name> | rain | light_rain | heavy_rain | summer | period:<key> | pandemic:lockdown | pandemic:reopening
# who       profile names from study/profiles (fabricator, food-stall, trial-advocate, junior-advocate,
#           firm-associate, in-house-counsel), or "*" for everyone
# says      one sentence added to the local's "Today"; {holiday} and {festival} are filled in
# place     replaces where the local is
# patience, read, slip   change the local's limits by this much (code applies them, the prompt never does)
#
# Festivals change the city, never a person's faith.

# ---- The week ----

[[effect]]
when = "sunday"
who = ["fabricator"]
says = "It is Sunday: the shop opens late and closes early."
patience = 1

[[effect]]
when = "sunday"
who = ["food-stall"]
says = "Sunday night: families are out and the queue is long."
patience = -1
read = -1

[[effect]]
when = "sunday"
who = ["trial-advocate", "junior-advocate"]
place = "At home on the sofa"
says = "Court is closed today; they are catching up on the week."
patience = 3
read = 3

[[effect]]
when = "sunday"
who = ["firm-associate"]
place = "At home with the work laptop"
says = "Sunday, but a deadline means working from home."
patience = 1

[[effect]]
when = "sunday"
who = ["in-house-counsel"]
place = "At home on the sofa"
says = "Sunday. Work can wait, but a message from a colleague came in."
patience = 2
read = 2

